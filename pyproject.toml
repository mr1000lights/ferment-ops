[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferment-ops"
version = "0.1.0"
description = "End-to-end data pipeline for bioprocess, feedstock and protein-market data (POC on public data)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Manohar Mandalapu" }]
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.1",
  "pyarrow>=15",
  "openpyxl>=3.1",
  "requests>=2.31",
  "pyyaml>=6",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
airflow = ["apache-airflow>=2.9"]

[project.scripts]
fdp = "fdp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"src/fdp/report/build_report.py" = ["E501"]   # inline HTML/CSS template
